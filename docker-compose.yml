version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: smart-gov-mongodb
    restart: unless-stopped
    # Do not expose the port to the host machine in production unless necessary
    # ports:
    #   - "27017:27017" 
    volumes:
      - mongodb_data:/data/db
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-gov-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-gov-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  mongodb_data:
