version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-gov-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ML_SERVICE_URL=http://ml-service:8001
    env_file:
      - ./backend/.env
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M


  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: smart-gov-ml-service
    restart: unless-stopped
    # Expose internally so backend can reach it, but allow scaling without host port conflicts
    expose:
      - "8001"
    env_file:
      - ./ml-service/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G

