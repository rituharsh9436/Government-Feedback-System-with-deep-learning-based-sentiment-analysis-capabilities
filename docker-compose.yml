version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: smart-gov-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-gov-backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=smart_gov_feedback
      - JWT_SECRET=your_super_secret_key_change_in_production
      - ADMIN_SECRET=admin123
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-gov-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
